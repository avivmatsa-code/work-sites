<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת לניהול חובות - אגף טכנולוגיות דיגיטליות ומידע</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Heebo', sans-serif; background-color: #f3f4f6; }
        .active-kpi { border-color: #328CC1 !important; background-color: #f0f9ff !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .active-filter { background-color: white !important; color: #0B3C5D !important; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Export Modal -->
    <div id="export-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4 border border-slate-200">
            <h3 class="text-xl font-black text-slate-800 mb-6 border-b pb-2">הפקת מכתב דרישה</h3>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="generateAction('download')" class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-2xl transition-all group">
                    <i class="fa-solid fa-file-pdf text-indigo-600 text-2xl"></i>
                    <div class="text-right"><p class="font-bold">שמור כ-PDF</p><p class="text-xs text-slate-500">הורדה למחשב</p></div>
                </button>
                <button onclick="generateAction('print')" class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-2xl transition-all group">
                    <i class="fa-solid fa-print text-blue-600 text-2xl"></i>
                    <div class="text-right"><p class="font-bold">הדפס מסמך</p><p class="text-xs text-slate-500">שליחה למדפסת</p></div>
                </button>
                <button onclick="generateAction('email')" class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-emerald-50 border border-slate-200 rounded-2xl transition-all group">
                    <i class="fa-solid fa-envelope-open-text text-emerald-600 text-2xl"></i>
                    <div class="text-right"><p class="font-bold">שלח בדוא"ל</p><p class="text-xs text-slate-500">העתקת טבלה למייל</p></div>
                </button>
                <button onclick="toggleExportModal(false)" class="mt-2 text-sm font-bold text-slate-400 hover:text-slate-600">סגור</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-[#0B3C5D] text-white px-6 py-4 shadow-lg border-b-4 border-[#328CC1] no-print">
        <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="bg-white p-2 rounded-lg text-[#0B3C5D] font-black text-lg">משרד התחבורה</div>
                <h1 class="text-xl font-bold italic">ניהול חובות ותזרים</h1>
            </div>

            <div class="flex bg-black/20 p-1 rounded-xl border border-white/10 shadow-inner">
                <button onclick="setIncomeFilter('all')" id="f-all" class="px-5 py-2 rounded-lg text-sm font-bold transition-all active-filter">הכל</button>
                <button onclick="setIncomeFilter('fees')" id="f-fees" class="px-5 py-2 rounded-lg text-sm font-bold transition-all hover:bg-white/5">אגרות</button>
                <button onclick="setIncomeFilter('info')" id="f-info" class="px-5 py-2 rounded-lg text-sm font-bold transition-all hover:bg-white/5">שירותי מידע</button>
            </div>

            <div class="flex items-center gap-4">
                <input type="file" id="excel-uploader" class="hidden" onchange="processExcel(event)">
                <label for="excel-uploader" class="cursor-pointer bg-[#D9B310] hover:bg-yellow-500 text-black px-6 py-2 rounded-full font-black text-sm shadow-md transition-all">
                    <i class="fa-solid fa-file-import ml-2"></i> קליטת קובץ אקסל
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] w-full mx-auto p-6 space-y-6 flex-grow no-print">
        
        <!-- KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div id="kpi-card-overdue" onclick="setKpiFilter('overdue')" class="bg-white p-6 rounded-2xl border-2 border-transparent cursor-pointer transition-all active-kpi shadow-sm">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-400 font-bold text-xs uppercase tracking-widest">חובות בפיגור</span>
                    <i class="fa-solid fa-triangle-exclamation text-red-500"></i>
                </div>
                <div class="text-4xl font-black text-red-700" id="total-overdue">₪0</div>
            </div>
            <div id="kpi-card-future" onclick="setKpiFilter('future')" class="bg-white p-6 rounded-2xl border-2 border-transparent cursor-pointer transition-all shadow-sm">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-400 font-bold text-xs uppercase tracking-widest">צפי תזרים עתידי</span>
                    <i class="fa-solid fa-calendar-check text-emerald-500"></i>
                </div>
                <div class="text-4xl font-black text-emerald-700" id="total-future">₪0</div>
            </div>
        </div>

        <!-- Table Area -->
        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col min-h-[450px]">
            <div class="bg-slate-50 p-4 border-b flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <button id="btn-back" onclick="navigateBack()" class="hidden bg-white border border-slate-300 px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-all">
                        <i class="fa-solid fa-arrow-right ml-2 text-blue-600"></i> חזרה
                    </button>
                    <h2 id="view-title" class="text-lg font-black text-[#0B3C5D]">מבנה חובות</h2>
                </div>
                <div id="level-tools" class="flex items-center gap-3">
                    <div id="sort-tools" class="hidden flex bg-slate-200 p-1 rounded-xl items-center shadow-inner">
                        <button onclick="setSort('amount')" id="sort-amount" class="px-3 py-1 text-[11px] font-bold rounded-lg bg-white shadow-sm transition-all">לפי סכום</button>
                        <button onclick="setSort('name')" id="sort-name" class="px-3 py-1 text-[11px] font-bold rounded-lg transition-all">לפי א-ת</button>
                    </div>
                    <button id="btn-letter" onclick="toggleExportModal(true)" class="hidden bg-indigo-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-indigo-700 transition-all">
                        <i class="fa-solid fa-file-invoice-dollar ml-2"></i> הפק מכתב חוב
                    </button>
                </div>
            </div>
            <div id="drilldown-viewport" class="p-6 flex-grow overflow-y-auto">
                <div class="text-center py-20 text-slate-300 font-medium">המערכת מאופסת. אנא טען קובץ אקסל גבייה מעודכן.</div>
            </div>
        </div>

        <!-- Analytics Area -->
        <div id="analytics-area" class="space-y-6 hidden">
            <!-- Row 1: Years -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-black text-slate-700 mb-4 border-b pb-2 tracking-tight"><i class="fa-solid fa-chart-pie ml-2 text-blue-500"></i>פילוח חוב לפי שנים (לתצוגה הנוכחית)</h3>
                    <div class="h-64 flex justify-center"><canvas id="yearsChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
                    <h3 class="font-black text-slate-700 mb-4 border-b pb-2 tracking-tight"><i class="fa-solid fa-table ml-2 text-blue-500"></i>ריכוז לפי שנים</h3>
                    <table class="w-full text-right text-sm">
                        <thead><tr class="text-slate-400 border-b"><th class="p-3 text-right">שנה</th><th class="p-3 text-center">כמות מסמכים</th><th class="p-3 text-left">סה"כ בש"ח</th></tr></thead>
                        <tbody id="years-table-body" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>

            <!-- Row 2: Months of Current Year -->
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                <h3 class="font-black text-slate-700 mb-4 border-b pb-2 tracking-tight"><i class="fa-solid fa-calendar-days ml-2 text-[#D9B310]"></i>פירוט שנה נוכחית (2026) לפי חודשים</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4" id="monthly-grid">
                    <!-- Monthly cards injected here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- State ---
        let db = []; 
        let incomeFilter = 'all';
        let kpiFilter = 'overdue';
        let currentLevel = 0; 
        let sortMode = 'amount';
        let path = { sector: null, orgName: null };
        let myChart = null;

        const TODAY = new Date(2026, 5, 22);
        const CURRENT_YEAR = 2026;
        const FEE_KEYWORDS = ['אגרה', 'אגרות', 'בעלות', 'רישיון'];
        const MONTH_NAMES = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

        // --- Core Functions ---
        function setIncomeFilter(f) {
            incomeFilter = f;
            document.querySelectorAll('[id^="f-"]').forEach(el => el.classList.remove('active-filter'));
            document.getElementById('f-' + f).classList.add('active-filter');
            currentLevel = 0; refresh();
        }

        function setKpiFilter(f) {
            kpiFilter = f;
            document.getElementById('kpi-card-overdue').classList.toggle('active-kpi', f === 'overdue');
            document.getElementById('kpi-card-future').classList.toggle('active-kpi', f === 'future');
            currentLevel = 0; refresh();
        }

        function setSort(s) {
            sortMode = s;
            document.getElementById('sort-amount').classList.toggle('bg-white', s === 'amount');
            document.getElementById('sort-name').classList.toggle('bg-white', s === 'name');
            renderView();
        }

        function refresh() {
            if (db.length === 0) return;
            const currentFilter = incomeFilter;
            const overdue = db.filter(r => r.isOverdue && isTypeMatch(r)).reduce((a, b) => a + b.amount, 0);
            const future = db.filter(r => !r.isOverdue && isTypeMatch(r)).reduce((a, b) => a + b.amount, 0);
            document.getElementById('total-overdue').innerText = formatCurrency(overdue);
            document.getElementById('total-future').innerText = formatCurrency(future);
            renderView();
        }

        function isTypeMatch(row) {
            if (incomeFilter === 'all') return true;
            return incomeFilter === 'fees' ? row.isFee : !row.isFee;
        }

        function renderView() {
            const view = document.getElementById('drilldown-viewport');
            const title = document.getElementById('view-title');
            const back = document.getElementById('btn-back');
            const btnLetter = document.getElementById('btn-letter');
            const sortTools = document.getElementById('sort-tools');
            
            let data = db.filter(r => (kpiFilter === 'overdue' ? r.isOverdue : !r.isOverdue) && isTypeMatch(r));
            if (db.length === 0) return;
            document.getElementById('analytics-area').classList.remove('hidden');

            if (currentLevel === 0) {
                back.classList.add('hidden'); btnLetter.classList.add('hidden'); sortTools.classList.add('hidden');
                title.innerText = "סקטורים עיקריים";
                const sectors = [{ id: "ממשלתי", name: "לקוחות ממשלתיים", icon: "fa-building-columns" },{ id: "שלטון מקומי", name: "לקוחות שלטון מקומי", icon: "fa-city" },{ id: "פרטי/רשויות", name: "רשויות ממשלתיות ולקוחות פרטיים", icon: "fa-handshake" }];
                let html = `<div class="grid grid-cols-1 md:grid-cols-3 gap-6">`;
                sectors.forEach(s => {
                    const sum = data.filter(r => r.sector === s.id).reduce((acc, r) => acc + r.amount, 0);
                    html += `<div onclick="selectSector('${s.id}')" class="bg-white border border-slate-200 p-8 rounded-3xl hover:shadow-xl hover:border-blue-400 cursor-pointer transition-all text-center">
                        <i class="fa-solid ${s.icon} text-4xl text-slate-200 mb-4"></i>
                        <h3 class="font-black text-lg">${s.name}</h3>
                        <p class="text-2xl font-black text-blue-700 mt-2">${formatCurrency(sum)}</p>
                    </div>`;
                });
                view.innerHTML = html + `</div>`;
                updateAnalytics(data);
            } 
            else if (currentLevel === 1) {
                back.classList.remove('hidden'); btnLetter.classList.add('hidden'); sortTools.classList.remove('hidden');
                title.innerText = path.sector;
                const sectorData = data.filter(r => r.sector === path.sector);
                const orgs = {};
                sectorData.forEach(r => { if (!orgs[r.name]) orgs[r.name] = { sum: 0 }; orgs[r.name].sum += r.amount; });
                let orgList = Object.entries(orgs).map(([name, val]) => ({ name, ...val }));
                if (sortMode === 'amount') orgList.sort((a,b) => b.sum - a.sum); else orgList.sort((a,b) => a.name.localeCompare(b.name, 'he'));
                let html = `<div class="space-y-3">`;
                orgList.forEach(org => {
                    html += `<div onclick="selectOrg('${org.name.replace(/'/g, "\\'")}')" class="flex justify-between items-center p-5 bg-white border border-slate-200 rounded-2xl hover:border-blue-400 hover:bg-blue-50 cursor-pointer transition-all shadow-sm">
                        <span class="font-bold text-slate-700 text-base"><i class="fa-solid fa-chevron-left ml-3 text-slate-300 text-xs"></i>${org.name}</span>
                        <span class="font-black text-xl text-blue-800">${formatCurrency(org.sum)}</span>
                    </div>`;
                });
                view.innerHTML = html || `<p class="text-center py-10 font-bold">אין נתונים</p>`;
                updateAnalytics(sectorData);
            }
            else if (currentLevel === 2) {
                back.classList.remove('hidden'); btnLetter.classList.remove('hidden'); sortTools.classList.add('hidden');
                title.innerText = path.orgName;
                const orgData = data.filter(r => r.name === path.orgName);
                let html = `<div id="capture-area"><table class="w-full text-right border-collapse rounded-2xl overflow-hidden border border-slate-200 shadow-sm">
                    <thead class="bg-slate-100 text-xs font-black border-b text-slate-500">
                        <tr><th class="p-4">מסמך</th><th class="p-4">מועד פירעון</th><th class="p-4">תיאור</th><th class="p-4 text-left">סכום בש"ח</th></tr>
                    </thead><tbody class="divide-y divide-slate-100 bg-white">`;
                orgData.forEach(r => {
                    html += `<tr><td class="p-4 font-mono text-slate-700 font-bold">${r.doc}</td><td class="p-4 text-slate-600">${r.dueDate.toLocaleDateString('he-IL')}</td><td class="p-4 text-slate-600">${r.desc}</td><td class="p-4 font-black text-left text-slate-900">${formatCurrency(r.amount)}</td></tr>`;
                });
                view.innerHTML = html + `</tbody></table></div>`;
                updateAnalytics(orgData);
            }
        }

        function selectSector(id) { path.sector = id; currentLevel = 1; renderView(); }
        function selectOrg(name) { path.orgName = name; currentLevel = 2; renderView(); }
        function navigateBack() { if(currentLevel > 0) { currentLevel--; renderView(); } }

        function updateAnalytics(data) {
            const yearGroups = {};
            const monthGroups = Array(12).fill(0).map(() => ({ sum: 0, count: 0 }));

            data.forEach(r => {
                const yr = r.dueDate.getFullYear();
                if (!yearGroups[yr]) yearGroups[yr] = { sum: 0, count: 0 };
                yearGroups[yr].sum += r.amount;
                yearGroups[yr].count++;

                if (yr === CURRENT_YEAR) {
                    const m = r.dueDate.getMonth();
                    monthGroups[m].sum += r.amount;
                    monthGroups[m].count++;
                }
            });

            // Update Years Table
            const tbody = document.getElementById('years-table-body');
            tbody.innerHTML = '';
            Object.entries(yearGroups).sort((a,b) => b[0]-a[0]).forEach(([yr, val]) => {
                tbody.innerHTML += `<tr><td class="p-3 font-bold text-blue-900">${yr}</td><td class="p-3 text-slate-400 text-center">${val.count}</td><td class="p-3 text-left font-black">${formatCurrency(val.sum)}</td></tr>`;
            });

            // Update Monthly Grid
            const mGrid = document.getElementById('monthly-grid');
            mGrid.innerHTML = '';
            monthGroups.forEach((m, idx) => {
                const hasData = m.sum > 0;
                mGrid.innerHTML += `
                    <div class="p-3 rounded-2xl border ${hasData ? 'bg-slate-50 border-blue-100' : 'bg-white border-slate-100 opacity-40'} transition-all">
                        <p class="text-[10px] font-bold text-slate-400 uppercase">${MONTH_NAMES[idx]}</p>
                        <p class="text-sm font-black ${hasData ? 'text-blue-900' : 'text-slate-300'}">${formatCurrency(m.sum)}</p>
                        <p class="text-[9px] text-slate-400">${m.count} מסמכים</p>
                    </div>`;
            });

            // Update Chart
            const ctx = document.getElementById('yearsChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(yearGroups),
                    datasets: [{
                        data: Object.values(yearGroups).map(v => v.sum),
                        backgroundColor: ['#0B3C5D', '#328CC1', '#D9B310', '#1D2731', '#718096'],
                        borderWidth: 5, borderColor: '#ffffff'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { weight: 'bold', size: 11 } } } } }
            });
        }

        function toggleExportModal(show) { document.getElementById('export-modal').style.display = show ? 'flex' : 'none'; }

        async function generateAction(mode) {
            const data = db.filter(r => r.name === path.orgName && (kpiFilter === 'overdue' ? r.isOverdue : !r.isOverdue) && isTypeMatch(r));
            const total = data.reduce((s, r) => s + r.amount, 0);
            const typeText = incomeFilter === 'all' ? 'כלל השירותים' : (incomeFilter === 'fees' ? 'אגרות' : 'שירותי מידע');

            if (mode === 'email') {
                toggleExportModal(false);
                const captureArea = document.getElementById('capture-area');
                const canvas = await html2canvas(captureArea);
                canvas.toBlob(async (blob) => {
                    const item = new ClipboardItem({ "image/png": blob });
                    await navigator.clipboard.write([item]);
                    alert("טבלת החשבוניות הועתקה כתמונה ללוח! פתח את המייל והדבק (Ctrl+V).");
                    window.location.href = `mailto:?subject=${encodeURIComponent('דרישת חוב - ' + path.orgName)}&body=${encodeURIComponent('שלום רב,\nמצורף פירוט חוב פתוח.\n\n[הדבק כאן את הטבלה]\n\nבכבוד רב,\nצוות הגבייה')}`;
                });
                return;
            }

            const win = window.open('', '_blank');
            win.document.write(`
                <html dir="rtl" lang="he"><head><title>מכתב חוב - ${path.orgName}</title>
                <style>
                    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 60px; line-height: 1.6; color: #333; }
                    .header { display: flex; justify-content: space-between; border-bottom: 2px solid #0B3C5D; padding-bottom: 10px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 30px; }
                    th, td { border: 1px solid #ccc; padding: 12px; text-align: right; }
                    th { background: #f8f9fa; font-weight: bold; }
                    .signature-container { margin-top: 100px; display: flex; justify-content: flex-end; }
                    .signature-block { width: 480px; display: flex; justify-content: space-between; align-items: flex-start; }
                </style></head>
                <body>
                    <div class="header"><div><b style="font-size:18px">משרד התחבורה והבטיחות בדרכים</b><br>אגף טכנולוגיות דיגיטליות ומידע</div><div>${new Date().toLocaleDateString('he-IL')}</div></div>
                    <p style="margin-top:40px">לכבוד: <br><b style="font-size:18px">${path.orgName}</b></p>
                    <h2 style="text-align:center; text-decoration:underline; margin: 40px 0">דרישת תשלום עבור ${typeText}</h2>
                    <p>שלום רב,<br>להלן פירוט החשבוניות והחיובים הפתוחים במערכותינו שטרם נפרעו:</p>
                    <table><thead><tr><th>מספר מסמך</th><th>מועד פירעון</th><th>תיאור השירות</th><th>סכום בש"ח</th></tr></thead>
                    <tbody>${data.map(r => `<tr><td>${r.doc}</td><td>${r.dueDate.toLocaleDateString('he-IL')}</td><td>${r.desc}</td><td style="text-align:left">${formatCurrency(r.amount)}</td></tr>`).join('')}
                    <tr style="font-weight:bold; background:#eee"><td colspan="3">סה"כ לתשלום</td><td style="text-align:left">${formatCurrency(total)}</td></tr></tbody></table>
                    <div class="signature-container">
                        <div class="signature-block">
                            <div style="font-size: 16px; margin-top: 5px;">בכבוד רב,</div>
                            <div style="text-align: center;">_______________________<br><b>צוות הגבייה</b><br>אגף טכנולוגיות דיגיטליות ומידע</div>
                        </div>
                    </div>
                </body></html>`);
            win.document.close();
            toggleExportModal(false);
            if (mode === 'print') setTimeout(() => win.print(), 500);
        }

        function processExcel(e) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const wb = XLSX.read(evt.target.result, { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                db = rows.filter(r => String(r['לקוח'] || '').length === 8).map(r => {
                    const code = String(r['לקוח']);
                    const dueDate = parseExcelDate(r['מועד פרעון נטו'] || r['תאריך תשלום']);
                    const desc = r['טקסט'] || '';
                    return {
                        code, name: String(r['שם חשבון'] || 'לקוח').trim(),
                        doc: r['מספר מסמך'] || '-',
                        dueDate, amount: parseFloat(String(r['סכום במטבע מסמך'] || 0).replace(/,/g, '')),
                        desc, isFee: FEE_KEYWORDS.some(kw => desc.includes(kw)),
                        isOverdue: dueDate < TODAY,
                        sector: code.startsWith('1') ? "ממשלתי" : code.startsWith('2') ? "שלטון מקומי" : "פרטי/רשויות"
                    };
                });
                currentLevel = 0; refresh();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        }

        function parseExcelDate(val) {
            if (!val) return new Date();
            if (!isNaN(val)) return new Date(Math.round((val - 25569) * 86400 * 1000));
            const p = String(val).split('/');
            return p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date(val);
        }

        function formatCurrency(v) { return "₪" + Math.round(v).toLocaleString('he-IL'); }
    </script>
</body>
</html>
