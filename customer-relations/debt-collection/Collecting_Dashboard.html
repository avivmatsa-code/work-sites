<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת לניהול הכנסות וגביית חובות - אגף טכנולוגיות דיגיטליות ומידע</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Heebo', sans-serif; background-color: #f3f4f6; }
        .active-kpi { border-color: #328CC1 !important; background-color: #f0f9ff !important; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .active-filter { background-color: white !important; color: #0B3C5D !important; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Export Modal -->
    <div id="export-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4 border border-slate-200">
            <h3 class="text-xl font-black text-slate-800 mb-6 border-b pb-2" id="export-modal-title">הפקת ריכוז חשבוניות</h3>
            <div class="grid grid-cols-1 gap-4">
                <button onclick="generateAction('download')" class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-2xl transition-all group text-right">
                    <i class="fa-solid fa-file-pdf text-indigo-600 text-2xl"></i>
                    <div><p class="font-bold">שמור כ-PDF</p><p class="text-xs text-slate-500">הורדה למחשב</p></div>
                </button>
                <button onclick="generateAction('print')" class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-2xl transition-all group text-right">
                    <i class="fa-solid fa-print text-blue-600 text-2xl"></i>
                    <div><p class="font-bold">הדפס מסמך</p><p class="text-xs text-slate-500">שליחה למדפסת</p></div>
                </button>
                <button onclick="generateAction('email')" class="flex items-center gap-4 p-4 bg-slate-50 hover:bg-emerald-50 border border-slate-200 rounded-2xl transition-all group text-right">
                    <i class="fa-solid fa-envelope-open-text text-emerald-600 text-2xl"></i>
                    <div><p class="font-bold">שלח בדוא"ל</p><p class="text-xs text-slate-500">העתקת טבלה למייל</p></div>
                </button>
                <button onclick="toggleExportModal(false)" class="mt-2 text-sm font-bold text-slate-400 hover:text-slate-600">סגור</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-[#0B3C5D] text-white px-6 py-4 shadow-lg border-b-4 border-[#328CC1] no-print">
        <div class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4 space-x-reverse">
                <div class="bg-white p-2 rounded-lg text-[#0B3C5D] font-black text-lg">משרד התחבורה</div>
                <div class="flex flex-col">
                    <h1 class="text-xl font-bold leading-tight">ניהול הכנסות וגביית חובות</h1>
                    <!-- תאריך עדכניות הנתונים יוצג כאן לאחר טעינת הקובץ -->
                    <p id="data-currency-date" class="text-xs text-slate-300 font-medium mt-0.5 hidden"></p>
                </div>
            </div>

            <!-- סידור מחדש של סדר האפשרויות במסנן -->
            <div class="flex bg-black/20 p-1 rounded-xl border border-white/10 shadow-inner">
                <button onclick="setIncomeFilter('all')" id="f-all" class="px-5 py-2 rounded-lg text-sm font-bold transition-all active-filter">הכל</button>
                <button onclick="setIncomeFilter('info')" id="f-info" class="px-5 py-2 rounded-lg text-sm font-bold transition-all hover:bg-white/5">שירותי מידע</button>
                <button onclick="setIncomeFilter('fees')" id="f-fees" class="px-5 py-2 rounded-lg text-sm font-bold transition-all hover:bg-white/5">אגרות העברת בעלות</button>
            </div>

            <div class="flex items-center gap-4 flex-wrap">
                <!-- קליטת קובץ חובות -->
                <input type="file" id="excel-uploader" class="hidden" onchange="processExcel(event)">
                <label for="excel-uploader" class="cursor-pointer bg-[#D9B310] hover:bg-yellow-500 text-black px-6 py-2 rounded-full font-black text-sm shadow-md transition-all">
                    <i class="fa-solid fa-file-import ml-2"></i> קליטת קובץ חובות
                </label>
                
                <input type="file" id="revenue-uploader" class="hidden" onchange="processRevenueExcel(event)">
                <label for="revenue-uploader" class="cursor-pointer bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2 rounded-full font-black text-sm shadow-md transition-all">
                    <i class="fa-solid fa-file-import ml-2"></i> קליטת קובץ הכנסות שנה נוכחית
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] w-full mx-auto p-6 space-y-6 flex-grow no-print">
        
        <!-- KPIs (סודרו מחדש: הכנסות מימין, אז חובות בפיגור ואז תזרים עתידי) -->
        <div id="kpi-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- סה"כ הכנסות (מופיע בצד ימין קיצוני בטעינת קובץ) -->
            <div id="kpi-card-revenue" class="bg-white p-6 rounded-2xl border-2 border-transparent transition-all shadow-sm hidden">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-400 font-bold text-xs uppercase tracking-widest">סה"כ הכנסות שנת 2026</span>
                    <i class="fa-solid fa-money-bill-wave text-emerald-500"></i>
                </div>
                <div class="text-4xl font-black text-emerald-700" id="total-revenue-kpi">₪0</div>
            </div>

            <!-- חובות בפיגור (מוצג במרכז) -->
            <div id="kpi-card-overdue" onclick="setKpiFilter('overdue')" class="bg-white p-6 rounded-2xl border-2 border-transparent cursor-pointer transition-all active-kpi shadow-sm">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-400 font-bold text-xs uppercase tracking-widest">חובות בפיגור</span>
                    <i class="fa-solid fa-triangle-exclamation text-red-500"></i>
                </div>
                <div class="text-4xl font-black text-red-700" id="total-overdue">₪0</div>
                <!-- פירוט חובות בפיגור לשנה הנוכחית ולשנים קודמות -->
                <div id="overdue-breakdown" class="text-xs text-red-600 font-bold mt-2 flex gap-4 hidden border-t border-red-50 pt-1.5">
                    <span>שנה נוכחית (2026): <span id="overdue-current">₪0</span></span>
                    <span>שנים קודמות: <span id="overdue-past">₪0</span></span>
                </div>
            </div>
            
            <!-- צפי תזרים עתידי (מוצג בשמאל) -->
            <div id="kpi-card-future" onclick="setKpiFilter('future')" class="bg-white p-6 rounded-2xl border-2 border-transparent cursor-pointer transition-all shadow-sm">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-400 font-bold text-xs uppercase tracking-widest">צפי תזרים עתידי</span>
                    <i class="fa-solid fa-calendar-check text-emerald-500"></i>
                </div>
                <div class="text-4xl font-black text-emerald-700" id="total-future">₪0</div>
            </div>
        </div>

        <!-- Table Area -->
        <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden flex flex-col min-h-[450px]">
            <div class="bg-slate-50 p-4 border-b flex justify-between items-center flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <button id="btn-back" onclick="navigateBack()" class="hidden bg-white border border-slate-300 px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition-all">
                        <i class="fa-solid fa-arrow-right ml-2 text-blue-600"></i> חזרה
                    </button>
                    <h2 id="view-title" class="text-lg font-black text-[#0B3C5D]">מבנה חובות</h2>
                </div>
                <div id="level-tools" class="flex items-center gap-3 flex-wrap">
                    
                    <!-- מסנן רשימת לקוחות (Level 1) - חובות / הכנסות / גם וגם -->
                    <div id="list-filter-container" class="hidden flex bg-slate-200 p-1 rounded-xl items-center shadow-inner">
                        <button onclick="setListFilter('debts')" id="lf-debts" class="px-3 py-1 text-[11px] font-bold rounded-lg bg-white shadow-sm transition-all">רק חובות</button>
                        <button onclick="setListFilter('revenue')" id="lf-revenue" class="px-3 py-1 text-[11px] font-bold rounded-lg transition-all">רק הכנסות</button>
                        <button onclick="setListFilter('both')" id="lf-both" class="px-3 py-1 text-[11px] font-bold rounded-lg transition-all">גם וגם</button>
                    </div>

                    <!-- מסנן פירוט חשבוניות לקוח (Level 2) - חובות / הכנסות שנה נוכחית -->
                    <div id="lvl2-filter-container" class="hidden flex bg-slate-200 p-1 rounded-xl items-center shadow-inner">
                        <button onclick="setLvl2View('debt')" id="l2-debt" class="px-3 py-1 text-[11px] font-bold rounded-lg bg-white shadow-sm transition-all">חשבוניות חוב</button>
                        <button onclick="setLvl2View('revenue')" id="l2-revenue" class="px-3 py-1 text-[11px] font-bold rounded-lg transition-all">הכנסות שנה נוכחית</button>
                    </div>

                    <!-- אפשרות הצגת אחוז חוב של לקוח מהסך במסך (שם שונה ל"הצג אחוז") -->
                    <label id="pct-toggle-container" class="hidden flex items-center gap-2 cursor-pointer bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-xl transition-all border border-slate-300">
                        <input type="checkbox" id="chk-show-pct" onchange="toggleShowPct(this.checked)" class="rounded text-blue-600 focus:ring-blue-500">
                        <span class="text-xs font-bold text-slate-700">הצג אחוז</span>
                    </label>

                    <div id="sort-tools" class="hidden flex bg-slate-200 p-1 rounded-xl items-center shadow-inner">
                        <button onclick="setSort('amount')" id="sort-amount" class="px-3 py-1 text-[11px] font-bold rounded-lg bg-white shadow-sm transition-all">לפי סכום</button>
                        <button onclick="setSort('name')" id="sort-name" class="px-3 py-1 text-[11px] font-bold rounded-lg transition-all">לפי א-ת</button>
                    </div>

                    <!-- כפתור לייצוא רשימת הלקוחות ל-PDF בדרגה 1 -->
                    <button id="btn-export-clients" onclick="exportClientsPdf()" class="hidden bg-emerald-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-emerald-700 transition-all">
                        <i class="fa-solid fa-file-invoice-dollar ml-2"></i> ייצוא רשימה ל-PDF
                    </button>

                    <!-- כפתור הפקת מכתב חוב מסורתי -->
                    <button id="btn-letter" onclick="toggleExportModal(true, 'debt')" class="hidden bg-indigo-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-indigo-700 transition-all">
                        <i class="fa-solid fa-file-invoice-dollar ml-2"></i> הפק מכתב חוב
                    </button>

                    <!-- לחצן הפקת דוח לקוח שנתי -->
                    <button id="btn-annual-report" onclick="toggleExportModal(true, 'annual')" class="hidden bg-emerald-600 text-white px-5 py-2 rounded-xl text-sm font-bold shadow-md hover:bg-emerald-700 transition-all">
                        <i class="fa-solid fa-file-invoice ml-2"></i> הפק דוח ללקוח
                    </button>
                </div>
            </div>
            <div id="drilldown-viewport" class="p-6 flex-grow overflow-y-auto">
                <div class="text-center py-20 text-slate-300 font-medium italic opacity-60">המערכת מאופסת. אנא טען קובץ אקסל גבייה מעודכן.</div>
            </div>
        </div>

        <!-- מיכל דינמי לפילוח חודשי של הכנסות - מוצג לפני פילוח החוב (החל מ-Analytics) -->
        <div id="revenue-monthly-container" class="space-y-6 hidden no-print"></div>

        <!-- Analytics Area -->
        <div id="analytics-area" class="space-y-6 hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="font-black text-slate-700 mb-4 border-b pb-2 tracking-tight" id="lbl-years-pie"><i class="fa-solid fa-chart-pie ml-2 text-blue-500"></i>פילוח חובות לפי שנים</h3>
                    <div class="h-64 flex justify-center"><canvas id="yearsChart"></canvas></div>
                </div>
                <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
                    <h3 class="font-black text-slate-700 mb-4 border-b pb-2 tracking-tight" id="lbl-years-table"><i class="fa-solid fa-table ml-2 text-blue-500"></i>ריכוז חובות לפי שנים</h3>
                    <table class="w-full text-right text-sm">
                        <thead><tr class="text-slate-400 border-b"><th class="p-3">שנה</th><th class="p-3 text-center">כמות מסמכים</th><th class="p-3 text-left">סה"כ בש"ח</th></tr></thead>
                        <tbody id="years-table-body" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
            
            <!-- מיכל דינמי לפילוח חודשי עבור כל השנים שיש בהן חוב -->
            <div id="yearly-monthly-grids-container" class="space-y-6"></div>
        </div>
    </main>

    <script>
        // --- State ---
        let db = []; 
        let revenueDb = []; // מאגר נתוני הכנסות שוטפות
        let incomeFilter = 'all';
        let kpiFilter = 'overdue';
        let currentLevel = 0; 
        let sortMode = 'amount';
        let listFilter = 'debts'; // מסנן לקוחות Level 1: debts, revenue, both
        let lvl2View = 'debt'; // מסנן חשבוניות לקוח Level 2: debt, revenue
        let exportContext = 'debt'; // 'debt' או 'annual' להפקת מכתבים
        let path = { sector: null, orgName: null };
        let myChart = null;
        let showClientPct = true; // ברירת המחדל להצגת אחוזים היא פעילה (כן)
        let currentOrgList = []; // שמירת רשימת הלקוחות המוצגים כעת במסך לצורך החיפוש החכם

        const TODAY = new Date(2026, 5, 22);
        const CURRENT_YEAR = 2026;
        const FEE_KEYWORDS = ['אגרה', 'אגרות', 'בעלות', 'רישיון'];
        const MONTH_NAMES = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

        function setIncomeFilter(f) {
            incomeFilter = f;
            document.querySelectorAll('[id^="f-"]').forEach(el => el.classList.remove('active-filter'));
            document.getElementById('f-' + f).classList.add('active-filter');
            currentLevel = 0; refresh();
        }

        function setKpiFilter(f) {
            kpiFilter = f;
            document.getElementById('kpi-card-overdue').classList.toggle('active-kpi', f === 'overdue');
            document.getElementById('kpi-card-future').classList.toggle('active-kpi', f === 'future');
            currentLevel = 0; refresh();
        }

        function setSort(s) {
            sortMode = s;
            document.getElementById('sort-amount').classList.toggle('bg-white', s === 'amount');
            document.getElementById('sort-amount').classList.toggle('shadow-sm', s === 'amount');
            document.getElementById('sort-name').classList.toggle('bg-white', s === 'name');
            document.getElementById('sort-name').classList.toggle('shadow-sm', s === 'name');
            renderView();
        }

        function toggleShowPct(checked) {
            showClientPct = checked;
            renderView();
        }

        function setListFilter(f) {
            listFilter = f;
            document.querySelectorAll('[id^="lf-"]').forEach(el => el.classList.remove('bg-white', 'shadow-sm'));
            document.getElementById('lf-' + f).classList.add('bg-white', 'shadow-sm');
            renderView();
        }

        function setLvl2View(v) {
            lvl2View = v;
            document.querySelectorAll('[id^="l2-"]').forEach(el => el.classList.remove('bg-white', 'shadow-sm'));
            document.getElementById('l2-' + v).classList.add('bg-white', 'shadow-sm');
            renderView();
        }

        function refresh() {
            if (db.length === 0) return;
            const overdueRows = db.filter(r => r.isOverdue && isTypeMatch(r));
            const overdue = overdueRows.reduce((a, b) => a + b.amount, 0);
            const future = db.filter(r => !r.isOverdue && isTypeMatch(r)).reduce((a, b) => a + b.amount, 0);
            
            // עדכון חלוקה פנימית של חובות בפיגור
            const overdueCurrent = overdueRows.filter(r => r.dueDate.getFullYear() === CURRENT_YEAR).reduce((a, b) => a + b.amount, 0);
            const overduePast = overdueRows.filter(r => r.dueDate.getFullYear() < CURRENT_YEAR).reduce((a, b) => a + b.amount, 0);
            
            document.getElementById('total-overdue').innerText = formatCurrency(overdue);
            document.getElementById('total-future').innerText = formatCurrency(future);
            
            document.getElementById('overdue-current').innerText = formatCurrency(overdueCurrent);
            document.getElementById('overdue-past').innerText = formatCurrency(overduePast);
            document.getElementById('overdue-breakdown').classList.remove('hidden');
            
            // עדכון KPI הכנסות במידה וקיים
            if (revenueDb.length > 0) {
                const totalRevenueSum = revenueDb.filter(r => r.regDate.getFullYear() === CURRENT_YEAR && isTypeMatch(r)).reduce((acc, r) => acc + r.amount, 0);
                document.getElementById('total-revenue-kpi').innerText = formatCurrency(totalRevenueSum);
                document.getElementById('kpi-card-revenue').classList.remove('hidden');
                document.getElementById('kpi-container').className = "grid grid-cols-1 md:grid-cols-3 gap-6";
            } else {
                document.getElementById('kpi-card-revenue').classList.add('hidden');
                document.getElementById('kpi-container').className = "grid grid-cols-1 md:grid-cols-2 gap-6";
            }

            renderView();
        }

        function isTypeMatch(row) {
            if (incomeFilter === 'all') return true;
            return incomeFilter === 'fees' ? row.isFee : !row.isFee;
        }

        function renderView() {
            const view = document.getElementById('drilldown-viewport');
            const title = document.getElementById('view-title');
            const back = document.getElementById('btn-back');
            const btnLetter = document.getElementById('btn-letter');
            const btnAnnualReport = document.getElementById('btn-annual-report');
            const sortTools = document.getElementById('sort-tools');
            const pctToggle = document.getElementById('pct-toggle-container');
            const btnExportClients = document.getElementById('btn-export-clients');
            const listFilterContainer = document.getElementById('list-filter-container');
            const lvl2FilterContainer = document.getElementById('lvl2-filter-container');
            
            let data = db.filter(r => (kpiFilter === 'overdue' ? r.isOverdue : !r.isOverdue) && isTypeMatch(r));
            if (db.length === 0) return;
            document.getElementById('analytics-area').classList.remove('hidden');

            const hasRevenue = revenueDb.length > 0;

            if (currentLevel === 0) {
                back.classList.add('hidden'); btnLetter.classList.add('hidden'); btnAnnualReport.classList.add('hidden'); sortTools.classList.add('hidden'); pctToggle.classList.add('hidden'); btnExportClients.classList.add('hidden'); listFilterContainer.classList.add('hidden'); lvl2FilterContainer.classList.add('hidden');
                title.innerText = "סקטורים עיקריים";
                const sectors = [
                    { id: "ממשלתי", name: "לקוחות ממשלתיים", icon: "fa-building-columns" },
                    { id: "שלטון מקומי", name: "לקוחות שלטון מקומי", icon: "fa-city" },
                    { id: "פרטי/רשויות", name: "רשויות ממשלתיות ולקוחות פרטיים", icon: "fa-handshake" }
                ];
                
                // חישוב הכנסה שנתית כוללת לשנה הנוכחית
                const totalRevenueSum = hasRevenue ? revenueDb.filter(r => r.regDate.getFullYear() === CURRENT_YEAR && isTypeMatch(r)).reduce((acc, r) => acc + r.amount, 0) : 0;
                // חישוב הסכום הכולל של החוב בסינון הנוכחי לצורך חישוב אחוזים
                const totalDebtSum = data.reduce((acc, r) => acc + r.amount, 0);

                let html = `<div class="grid grid-cols-1 md:grid-cols-3 gap-6">`;
                sectors.forEach(s => {
                    const sectorDebt = data.filter(r => r.sector === s.id).reduce((acc, r) => acc + r.amount, 0);
                    const sectorDebtPct = totalDebtSum > 0 ? (sectorDebt / totalDebtSum * 100).toFixed(1) : "0.0";
                    
                    if (hasRevenue) {
                        const sectorRevenue = revenueDb.filter(r => r.sector === s.id && r.regDate.getFullYear() === CURRENT_YEAR && isTypeMatch(r)).reduce((acc, r) => acc + r.amount, 0);
                        const sectorRevPct = totalRevenueSum > 0 ? (sectorRevenue / totalRevenueSum * 100).toFixed(1) : "0.0";

                        html += `
                            <div onclick="selectSector('${s.id}')" class="bg-white border border-slate-200 p-6 rounded-3xl hover:shadow-xl hover:border-blue-400 cursor-pointer transition-all flex flex-col justify-between h-full min-h-[220px]">
                                <div class="text-center">
                                    <i class="fa-solid ${s.icon} text-3xl text-slate-200 mb-2"></i>
                                    <h3 class="font-black text-base text-slate-800 leading-tight">${s.name}</h3>
                                </div>
                                <div class="mt-4 space-y-3">
                                    <div class="text-right">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">הכנסות שנת ${CURRENT_YEAR}:</p>
                                        <p class="text-lg font-black text-emerald-700 leading-none">${formatCurrency(sectorRevenue)}</p>
                                        <p class="text-[10px] text-slate-400 font-bold mt-1">${sectorRevPct}% מסך ההכנסות</p>
                                    </div>
                                    <div class="border-t border-slate-100 pt-2 text-right">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">חובות פתוחים:</p>
                                        <p class="text-lg font-black text-red-700 leading-none">${formatCurrency(sectorDebt)}</p>
                                        <p class="text-[10px] text-slate-400 font-bold mt-1">${sectorDebtPct}% מסך החובות</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div onclick="selectSector('${s.id}')" class="bg-white border border-slate-200 p-8 rounded-3xl hover:shadow-xl hover:border-blue-400 cursor-pointer transition-all text-center flex flex-col justify-between h-full min-h-[200px]">
                                <div>
                                    <i class="fa-solid ${s.icon} text-4xl text-slate-200 mb-4"></i>
                                    <h3 class="font-black text-lg text-slate-800">${s.name}</h3>
                                </div>
                                <div class="mt-4">
                                    <p class="text-2xl font-black text-blue-700">${formatCurrency(sectorDebt)}</p>
                                    <p class="text-xs text-slate-400 font-bold mt-1">${sectorDebtPct}% מסך החוב</p>
                                </div>
                            </div>
                        `;
                    }
                });
                view.innerHTML = html + `</div>`;
                updateAnalytics(data);
            } 
            else if (currentLevel === 1) {
                back.classList.remove('hidden'); btnLetter.classList.add('hidden'); btnAnnualReport.classList.add('hidden'); sortTools.classList.remove('hidden'); pctToggle.classList.remove('hidden'); btnExportClients.classList.remove('hidden'); lvl2FilterContainer.classList.add('hidden');
                document.getElementById('chk-show-pct').checked = showClientPct;
                title.innerText = "ארגונים בסקטור " + path.sector;

                if (hasRevenue) {
                    listFilterContainer.classList.remove('hidden');
                } else {
                    listFilterContainer.classList.add('hidden');
                    listFilter = 'debts';
                }

                const sectorData = data.filter(r => r.sector === path.sector);
                const sectorRevenueData = hasRevenue ? revenueDb.filter(r => r.sector === path.sector && isTypeMatch(r)) : [];
                
                const orgs = {};
                
                if (listFilter === 'debts' || listFilter === 'both') {
                    sectorData.forEach(r => {
                        if (!orgs[r.name]) orgs[r.name] = { debtSum: 0, revSum: 0, count: 0, code: r.code };
                        orgs[r.name].debtSum += r.amount;
                        orgs[r.name].count++;
                    });
                }

                if (hasRevenue && (listFilter === 'revenue' || listFilter === 'both')) {
                    sectorRevenueData.forEach(r => {
                        if (!orgs[r.name]) orgs[r.name] = { debtSum: 0, revSum: 0, count: 0, code: r.code };
                        orgs[r.name].revSum += r.amount;
                        if (listFilter === 'revenue') orgs[r.name].count++;
                    });
                }

                let orgList = Object.entries(orgs).map(([name, val]) => ({ name, ...val }));
                
                if (sortMode === 'amount') {
                    orgList.sort((a, b) => {
                        const valA = listFilter === 'revenue' ? (Number(a.revSum) || 0) : (listFilter === 'debts' ? (Number(a.debtSum) || 0) : ((Number(a.debtSum) || 0) + (Number(a.revSum) || 0)));
                        const valB = listFilter === 'revenue' ? (Number(b.revSum) || 0) : (listFilter === 'debts' ? (Number(b.debtSum) || 0) : ((Number(b.debtSum) || 0) + (Number(b.revSum) || 0)));
                        return valB - valA;
                    });
                } else {
                    orgList.sort((a,b) => a.name.localeCompare(b.name, 'he'));
                }

                // שמירה במצב הגלובלי לצורך שימוש בפונקציית החיפוש החכם והממוקד
                currentOrgList = orgList;

                const sectorTotalDebt = sectorData.reduce((acc, r) => acc + r.amount, 0);
                const sectorTotalRev = sectorRevenueData.reduce((acc, r) => acc + r.amount, 0);

                let searchHtml = `
                <div class="relative w-full max-w-md mb-5 no-print">
                    <div class="flex items-center bg-slate-100 border border-slate-200 rounded-2xl px-4 py-2.5 focus-within:ring-2 focus-within:ring-blue-500 focus-within:bg-white transition-all shadow-sm">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 ml-2.5 text-sm"></i>
                        <input type="text" id="client-search-input" oninput="handleSearchInput(this.value)" placeholder="חיפוש לקוח חכם מתוך הרשימה..." class="bg-transparent border-none outline-none w-full text-sm text-slate-700 placeholder-slate-400" autocomplete="off">
                    </div>
                    <div id="search-suggestions" class="absolute right-0 left-0 bg-white border border-slate-200 rounded-2xl shadow-xl mt-1.5 hidden z-50 max-h-60 overflow-y-auto divide-y divide-slate-100"></div>
                </div>
                `;

                let html = searchHtml + `<div class="space-y-3">`;
                orgList.forEach(org => {
                    const safeName = org.name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    
                    const dSum = Number(org.debtSum) || 0;
                    const rSum = Number(org.revSum) || 0;

                    const debtPct = sectorTotalDebt > 0 ? (dSum / sectorTotalDebt * 100).toFixed(1) : "0.0";
                    const revPct = sectorTotalRev > 0 ? (rSum / sectorTotalRev * 100).toFixed(1) : "0.0";

                    let displayDetails = "";
                    if (listFilter === 'debts') {
                        displayDetails = showClientPct ? `${debtPct}% מסך החובות, ${org.count} מסמכים פתוחים` : `${org.count} מסמכים פתוחים`;
                    } else if (listFilter === 'revenue') {
                        displayDetails = showClientPct ? `${revPct}% מסך ההכנסות, ${org.count} מסמכי הכנסה` : `${org.count} מסמכי הכנסה`;
                    } else { // "גם וגם" - מציג בנפרד את האחוז מסך החובות ואת האחוז מסך ההכנסות
                        displayDetails = showClientPct 
                            ? `חוב: ${debtPct}% מהסך, הכנסה: ${revPct}% מהסך, ${org.count} מסמכים` 
                            : `${org.count} מסמכים`;
                    }

                    let sumDisplayHtml = "";
                    if (listFilter === 'debts') {
                        sumDisplayHtml = `<span class="font-black text-xl text-red-700">${formatCurrency(dSum)}</span>`;
                    } else if (listFilter === 'revenue') {
                        sumDisplayHtml = `<span class="font-black text-xl text-emerald-700">${formatCurrency(rSum)}</span>`;
                    } else { // מצג "גם וגם" אופקי זה לצד זה
                        sumDisplayHtml = `
                            <div class="flex items-center gap-6 text-left">
                                <div class="border-l border-slate-200 pl-6">
                                    <p class="text-[10px] text-slate-400 font-bold">חוב פתוח</p>
                                    <p class="font-black text-base text-red-700 leading-tight">${formatCurrency(dSum)}</p>
                                </div>
                                <div>
                                    <p class="text-[10px] text-slate-400 font-bold">הכנסות שוטפות</p>
                                    <p class="font-black text-base text-emerald-700 leading-tight">${formatCurrency(rSum)}</p>
                                </div>
                            </div>
                        `;
                    }

                    html += `<div onclick="selectOrg('${safeName}')" class="flex justify-between items-center p-5 bg-white border border-slate-200 rounded-2xl hover:border-blue-400 hover:bg-blue-50 cursor-pointer transition-all shadow-sm">
                        <div class="text-right">
                            <p class="font-bold text-slate-700 text-base leading-tight">${org.name}</p>
                            <p class="text-[11px] text-slate-400 font-bold mt-1">${displayDetails}</p>
                        </div>
                        <div class="flex items-center gap-3">
                            ${sumDisplayHtml}
                            <i class="fa-solid fa-chevron-left text-slate-300 text-xs"></i>
                        </div>
                    </div>`;
                });
                view.innerHTML = html || `<p class="text-center py-10 font-bold">אין נתונים בסקטור זה</p>`;
                updateAnalytics(sectorData);
            }
            else if (currentLevel === 2) {
                back.classList.remove('hidden'); sortTools.classList.add('hidden'); pctToggle.classList.add('hidden'); btnExportClients.classList.add('hidden'); listFilterContainer.classList.add('hidden');
                title.innerText = path.orgName;

                if (hasRevenue) {
                    lvl2FilterContainer.classList.remove('hidden');
                    btnLetter.classList.remove('hidden');
                    btnAnnualReport.classList.remove('hidden');
                } else {
                    lvl2FilterContainer.classList.add('hidden');
                    lvl2View = 'debt';
                    btnLetter.classList.remove('hidden');
                    btnAnnualReport.classList.add('hidden');
                }

                // משיכת כלל החשבוניות המהוות את חוב הלקוח (הן אלו שבפיגור והן העתידיות)
                const orgData = db.filter(r => r.name === path.orgName && isTypeMatch(r));
                
                // מיון לפי תאריך פירעון מהישן לחדש (סדר כרונולוגי עולה)
                orgData.sort((a, b) => a.dueDate - b.dueDate);

                let html = "";

                if (lvl2View === 'debt') {
                    // עימוד עם גודל גופן אחיד לטבלה וסימוני עמודה עתידיים
                    html = `<div id="capture-area"><table class="w-full text-right border-collapse rounded-2xl overflow-hidden border border-slate-200 shadow-sm">
                        <thead class="bg-slate-100 text-xs font-black border-b text-slate-500 uppercase">
                            <tr><th class="p-4">מספר מסמך</th><th class="p-4">מועד פירעון</th><th class="p-4">תיאור השירות</th><th class="p-4 text-left">סכום בש"ח</th></tr>
                        </thead><tbody class="divide-y divide-slate-100 bg-white">`;
                    orgData.forEach(r => {
                        const isFuture = !r.isOverdue;
                        const rowBg = isFuture ? 'bg-emerald-50/50 hover:bg-emerald-100/50 transition-all text-emerald-950' : 'hover:bg-blue-50 transition-colors';
                        const statusBadge = isFuture 
                            ? `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2"><i class="fa-solid fa-clock ml-1"></i>עתידי</span>` 
                            : `<span class="bg-red-100 text-red-800 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2"><i class="fa-solid fa-triangle-exclamation ml-1"></i>בפיגור</span>`;

                        html += `<tr class="${rowBg}">
                            <td class="p-4 font-bold text-slate-700">${r.doc} ${statusBadge}</td>
                            <td class="p-4">${r.dueDate.toLocaleDateString('he-IL')}</td>
                            <td class="p-4">${r.desc}</td>
                            <td class="p-4 font-black text-left text-slate-900">${formatCurrency(r.amount)}</td>
                        </tr>`;
                    });
                    html += `</tbody></table></div>`;
                    
                    // תיקון הבאג: שליחת נתוני החוב האקטיביים של הארגון בלבד כדי שלוח השנה של החובות לא יינזק
                    const activeOrgDebts = data.filter(r => r.name === path.orgName);
                    updateAnalytics(activeOrgDebts);
                } else {
                    const orgRevenues = revenueDb.filter(r => r.name === path.orgName && r.regDate.getFullYear() === CURRENT_YEAR && isTypeMatch(r));
                    
                    // מיון לפי תאריך פירעון מהישן לחדש (סדר כרונולוגי עולה)
                    orgRevenues.sort((a, b) => a.dueDate - b.dueDate);

                    html = `<div id="capture-area"><table class="w-full text-right border-collapse rounded-2xl overflow-hidden border border-slate-200 shadow-sm">
                        <thead class="bg-slate-100 text-xs font-black border-b text-slate-500 uppercase">
                            <tr><th class="p-4">מספר מסמך</th><th class="p-4">תאריך רישום</th><th>מועד פירעון</th><th class="p-4">תיאור השירות</th><th>סטטוס</th><th class="p-4 text-left">סכום בש"ח</th></tr>
                        </thead><tbody class="divide-y divide-slate-100 bg-white">`;
                    
                    orgRevenues.forEach(r => {
                        const isUnpaidDebt = db.some(d => d.doc === r.doc);
                        const isFuture = isUnpaidDebt && !db.find(d => d.doc === r.doc).isOverdue;

                        const rowBg = isUnpaidDebt ? 'bg-red-50/70 hover:bg-red-100 transition-all text-red-900' : 'hover:bg-blue-50 transition-colors';
                        
                        let statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2"><i class="fa-solid fa-circle-check ml-1"></i>שולם</span>`;
                        if (isUnpaidDebt) {
                            statusBadge = isFuture 
                                ? `<span class="bg-emerald-100 text-emerald-800 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2"><i class="fa-solid fa-clock ml-1"></i>עתידי (פתוח)</span>`
                                : `<span class="bg-red-100 text-red-800 text-[10px] px-2 py-0.5 rounded-full font-bold ml-2"><i class="fa-solid fa-triangle-exclamation ml-1"></i>פתוח</span>`;
                        }

                        html += `<tr class="${rowBg}">
                            <td class="p-4 font-bold text-slate-700">${r.doc}</td>
                            <td class="p-4">${r.regDate.toLocaleDateString('he-IL')}</td>
                            <td class="p-4">${r.dueDate.toLocaleDateString('he-IL')}</td>
                            <td class="p-4">${r.desc}</td>
                            <td class="p-4">${statusBadge}</td>
                            <td class="p-4 font-black text-left">${formatCurrency(r.amount)}</td>
                        </tr>`;
                    });
                    html += `</tbody></table></div>`;
                    
                    // תיקון הבאג: שליחת נתוני החוב האקטיביים של הארגון בלבד כדי שלוח השנה של החובות לא יינזק
                    const activeOrgDebts = data.filter(r => r.name === path.orgName);
                    updateAnalytics(activeOrgDebts);
                }

                view.innerHTML = html;
            }
        }

        // חיפוש חכם וממוקד אך ורק מתוך הנתונים המוצגים כעת במסך (currentOrgList)
        function handleSearchInput(query) {
            const suggestionsBox = document.getElementById('search-suggestions');
            if (!query || query.trim() === '') {
                suggestionsBox.innerHTML = '';
                suggestionsBox.classList.add('hidden');
                return;
            }

            const normalizedQuery = query.toLowerCase();
            const matches = currentOrgList.filter(org => org.name.toLowerCase().includes(normalizedQuery)).slice(0, 8);

            if (matches.length === 0) {
                suggestionsBox.innerHTML = '<div class="p-3 text-xs text-slate-400 italic text-right">לא נמצאו לקוחות מתאימים</div>';
                suggestionsBox.classList.remove('hidden');
                return;
            }

            let html = '';
            matches.forEach(org => {
                const escapedName = org.name.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                html += `
                    <div onclick="selectSearchClient('${escapedName}')" class="p-3 text-sm hover:bg-blue-50 cursor-pointer transition-colors text-right font-medium text-slate-700">
                        ${org.name}
                    </div>
                `;
            });
            suggestionsBox.innerHTML = html;
            suggestionsBox.classList.remove('hidden');
        }

        function selectSearchClient(name) {
            const suggestionsBox = document.getElementById('search-suggestions');
            if (suggestionsBox) {
                suggestionsBox.innerHTML = '';
                suggestionsBox.classList.add('hidden');
            }
            const input = document.getElementById('client-search-input');
            if (input) input.value = '';

            // העברה ישירה למסך החשבוניות (Level 2)
            selectOrg(name);
        }

        // סגירת התיבה בלחיצה מחוץ לתווח החיפוש
        document.addEventListener('click', function(e) {
            const box = document.getElementById('search-suggestions');
            const input = document.getElementById('client-search-input');
            if (box && !box.contains(e.target) && e.target !== input) {
                box.classList.add('hidden');
            }
        });

        function selectSector(id) { path.sector = id; currentLevel = 1; renderView(); }
        function selectOrg(name) { path.orgName = name; currentLevel = 2; renderView(); }
        function navigateBack() { if(currentLevel > 0) { currentLevel--; renderView(); } }

        function updateAnalytics(data) {
            const hasRevenue = db.length > 0 && revenueDb.length > 0;

            document.getElementById('lbl-years-pie').innerHTML = `<i class="fa-solid fa-chart-pie ml-2 text-blue-500"></i>${hasRevenue ? 'פילוח חובות לפי שנים' : 'פילוח חוב לפי שנים'}`;
            document.getElementById('lbl-years-table').innerHTML = `<i class="fa-solid fa-table ml-2 text-blue-500"></i>${hasRevenue ? 'ריכוז חובות לפי שנים' : 'ריכוז לפי שנים'}`;

            // 1. פילוח לפי שנים
            const yearGroups = {};
            data.forEach(r => {
                const yr = r.dueDate.getFullYear();
                if (!yearGroups[yr]) yearGroups[yr] = { sum: 0, count: 0 };
                yearGroups[yr].sum += r.amount; 
                yearGroups[yr].count++;
            });

            const tbody = document.getElementById('years-table-body'); 
            tbody.innerHTML = '';
            Object.entries(yearGroups).sort((a,b) => b[0] - a[0]).forEach(([yr, val]) => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-3 font-bold text-blue-900 cursor-pointer underline hover:text-blue-700" onclick="exportBreakdownPdf(${yr})">${yr}</td>
                        <td class="p-3 text-slate-400 text-center">${val.count}</td>
                        <td class="p-3 text-left font-black">${formatCurrency(val.sum)}</td>
                    </tr>`;
            });

            // 2. פילוח חודשי
            const revMonthlyContainer = document.getElementById('revenue-monthly-container');
            const yearsContainer = document.getElementById('yearly-monthly-grids-container');
            yearsContainer.innerHTML = '';
            revMonthlyContainer.innerHTML = '';

            if (hasRevenue) {
                const revMonthGroups = Array(12).fill(0).map(() => ({ sum: 0, count: 0 }));
                let currentScopeRevenues = revenueDb.filter(r => r.regDate.getFullYear() === CURRENT_YEAR && isTypeMatch(r));
                
                if (currentLevel === 1) {
                    currentScopeRevenues = currentScopeRevenues.filter(r => r.sector === path.sector);
                } else if (currentLevel === 2) {
                    currentScopeRevenues = currentScopeRevenues.filter(r => r.name === path.orgName);
                }

                currentScopeRevenues.forEach(r => {
                    const m = r.regDate.getMonth();
                    revMonthGroups[m].sum += r.amount;
                    revMonthGroups[m].count++;
                });

                let revMonthGridHtml = '';
                revMonthGroups.forEach((m, idx) => {
                    const hasData = m.sum > 0;
                    revMonthGridHtml += `
                        <div class="p-3 rounded-2xl border ${hasData ? 'bg-emerald-50 border-emerald-100' : 'bg-white border-slate-100 opacity-40'}">
                            <p class="text-[10px] font-bold text-slate-400">${MONTH_NAMES[idx]}</p>
                            <p class="text-sm font-black ${hasData ? 'text-emerald-900' : 'text-slate-200'}">${formatCurrency(m.sum)}</p>
                            <p class="text-[9px] text-slate-300 font-bold">${m.count} תקבולים</p>
                        </div>
                    `;
                });

                // מיקום חדש: מסגרת ההכנסות ממוקמת לפני פילוח החוב (החל מ-Analytics)
                revMonthlyContainer.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 border-r-8 border-r-emerald-500">
                        <h3 class="font-black text-slate-700 mb-4 border-b pb-2 tracking-tight">
                            <i class="fa-solid fa-money-bill-trend-up ml-2 text-emerald-600"></i>פירוט הכנסות שנת ${CURRENT_YEAR} לפי חודשים
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                            ${revMonthGridHtml}
                        </div>
                    </div>
                `;
                revMonthlyContainer.classList.remove('hidden');
            } else {
                revMonthlyContainer.classList.add('hidden');
            }

            // גריד חודשי של החובות
            const sortedYears = Object.keys(yearGroups).map(Number).sort((a, b) => b - a);
            sortedYears.forEach(year => {
                const monthGroups = Array(12).fill(0).map(() => ({ sum: 0, count: 0 }));
                
                data.forEach(r => {
                    if (r.dueDate.getFullYear() === year) {
                        const m = r.dueDate.getMonth();
                        monthGroups[m].sum += r.amount;
                        monthGroups[m].count++;
                    }
                });

                let monthGridHtml = '';
                monthGroups.forEach((m, idx) => {
                    const hasData = m.sum > 0;
                    const clickAttr = hasData ? `onclick="exportBreakdownPdf(${year}, ${idx})"` : '';
                    const cursorClass = hasData ? 'cursor-pointer hover:border-blue-400 hover:shadow-sm transition-all' : '';
                    
                    monthGridHtml += `
                        <div ${clickAttr} class="p-3 rounded-2xl border ${hasData ? 'bg-slate-50 border-blue-100 ' + cursorClass : 'bg-white border-slate-100 opacity-40'}">
                            <p class="text-[10px] font-bold text-slate-400">${MONTH_NAMES[idx]}</p>
                            <p class="text-sm font-black ${hasData ? 'text-blue-900 underline' : 'text-slate-200'}">${formatCurrency(m.sum)}</p>
                            <p class="text-[9px] text-slate-300 font-bold">${m.count} מסמכים</p>
                        </div>
                    `;
                });

                yearsContainer.innerHTML += `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <h3 class="font-black text-slate-700 mb-4 border-b pb-2 tracking-tight">
                            <i class="fa-solid fa-calendar-days ml-2 text-[#D9B310]"></i>פירוט חובות שנת ${year} לפי חודשים
                        </h3>
                        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
                            ${monthGridHtml}
                        </div>
                    </div>
                `;
            });

            // 3. עדכון גרף דונאט
            const ctx = document.getElementById('yearsChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, { 
                type: 'doughnut', 
                data: { 
                    labels: Object.keys(yearGroups), 
                    datasets: [{ 
                        data: Object.values(yearGroups).map(v => v.sum), 
                        backgroundColor: ['#0B3C5D', '#328CC1', '#D9B310', '#1D2731', '#718096'], 
                        borderWidth: 5, 
                        borderColor: '#ffffff' 
                    }] 
                }, 
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    cutout: '75%', 
                    plugins: { legend: { position: 'bottom' } } 
                } 
            });
        }

                                    const isUnpaid = db.some(d => d.doc === r.doc && d.name === path.orgName);
                                    const isFuture = isUnpaid && !db.find(d => d.doc === r.doc).isOverdue;
                                    
                                    // הוספת מזהה (עתידי) לחשבוניות חוב עתידיות בתוך הטבלה
                                    const futureLabel = isFuture ? ' <span style="color:#059669; font-size:11px; font-weight:bold;">(עתידי)</span>' : '';
                                    const statusText = isUnpaid 
                                        ? (isFuture ? '<b style="color:#059669;">עתידי (טרם שולם)</b>' : '<b style="color:#b91c1c;">טרם שולם</b>') 
                                        : 'שולם';
                                    return `
                                        <tr style="${isUnpaid ? 'background-color:#fef2f2;' : ''}">
                                            <td>${r.doc}${futureLabel}</td>
                                            <td>${r.regDate.toLocaleDateString('he-IL')}</td>
                                            <td>${r.desc}</td>
                                            <td>${statusText}</td>

                                }).join('')}
                                <tr style="font-weight:bold; background:#eee">
                                    <td colspan="4">סה"כ הכנסות שנת ${CURRENT_YEAR}</td>
                                    <td style="text-align:left;">${formatCurrency(currentTotal)}</td>
                                </tr>
                            </tbody>
                        </table>

                        ${chartHtml}

                        ${pastTableHtml}

                        <div style="page-break-inside: avoid; break-inside: avoid; margin-top: 30px;">
                            
                            ${paymentLinkHtml}

                            <div class="signature-area">
                                <div class="signature-box">
                                    <div style="font-weight: bold; text-align: right; padding-right: 40px;">בכבוד רב,</div>
                                    <div style="text-align: center; margin-right: auto; width: 220px; margin-top: 40px; font-size: 14px; line-height: 1.6;">
                                        _______________________<br>
                                        <b style="display: inline-block; margin-top: 8px;">מחלקת שירות לקוחות וגבייה</b><br>
                                        אגף טכנולוגיות דיגיטליות ומידע<br>
                                        <a href="mailto:customer@mot.gov.il" style="color: #0B3C5D; text-decoration: none;">customer@mot.gov.il</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        ${autoPrintScript}
                    </body></html>
                `);
                win.document.close();
                toggleExportModal(false);
                return;
            }

            // הפקת מכתב חוב מסורתי (ממוין כעת לפי תאריך פירעון כרונולוגי עולה)
            const overdueRows = db.filter(r => r.isOverdue && r.name === path.orgName && isTypeMatch(r));
            overdueRows.sort((a, b) => a.dueDate - b.dueDate);
            const total = overdueRows.reduce((s, r) => s + r.amount, 0);

            const win = window.open('', '_blank');
            if (!win) {
                alert("פתיחת החלון החדש נחסמה.");
                return;
            }

            const autoPrintScript = (mode === 'print' || mode === 'download') ? `
                <script>
                    window.focus();
                    setTimeout(function() {
                        window.print();
                    }, 250);
                <\/script>
            ` : '';

            win.document.write(`
                <html dir="rtl" lang="he"><head><title>ריכוז חשבוניות פתוחות - ${path.orgName}</title>
                <style>
                    body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; padding: 60px; line-height: 1.6; color: #333; }
                    .header { display: flex; justify-content: space-between; border-bottom: 3px solid #0B3C5D; padding-bottom: 10px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 30px; }
                    th, td { border: 1px solid #ddd; padding: 12px; text-align: right; }
                    th { background: #f8f9fa; }
                    .signature-area { margin-top: 80px; display: flex; justify-content: flex-end; }
                    .signature-box { width: 380px; display: flex; flex-direction: column; }
                    @media print {
                        @page { margin: 0; }
                        body { margin: 2cm; padding: 0; }
                    }
                </style>
                </head>
                <body>
                    <div class="header"><div><b style="font-size:18px">משרד התחבורה והבטיחות בדרכים</b><br>אגף טכנולוגיות דיגיטליות ומידע</div><div>${new Date().toLocaleDateString('he-IL')}</div></div>
                    <p style="margin-top:40px">לכבוד: <br><b style="font-size:18px">${path.orgName}</b></p>
                    <h2 style="text-align:center; margin: 40px 0">ריכוז חשבוניות פתוחות עבור ${typeText}</h2>
                    <p>שלום רב,<br>להלן פירוט החשבוניות והחיובים הפתוחים במערכותינו שטרם הותאמו:</p>
                    
                    <table><thead><tr><th>מספר מסמך</th><th>מועד פירעון</th><th>תיאור השירות</th><th style="text-align:left">סכום בש"ח</th></tr></thead>
                    <tbody>${overdueRows.map(r => `<tr><td>${r.doc}</td><td>${r.dueDate.toLocaleDateString('he-IL')}</td><td>${r.desc}</td><td style="text-align:left">${formatCurrency(r.amount)}</td></tr>`).join('')}
                    <tr style="font-weight:bold; background:#eee"><td colspan="3">סה"כ לתשלום</td><td style="text-align:left">${formatCurrency(total)}</td></tr></tbody></table>
                    
                    <div style="page-break-inside: avoid; break-inside: avoid; margin-top: 30px;">
                        <div style="font-size: 14px; color: #333; line-height: 1.8;">
                            <p style="margin-bottom: 8px;">להלן הקישור לתשלום החוב בשרת התשלומים: <a href="https://ecom.gov.il/voucherspa/input/414" target="_blank" style="color: #0B3C5D; font-weight: bold; text-decoration: underline;">https://ecom.gov.il/voucherspa/input/414</a></p>
                            <p style="margin-bottom: 16px;">מספר לקוח במרכבה: <b>${clientCode}</b></p>
                            
                            <p style="margin-top: 16px; margin-bottom: 8px;">השירות מותנה בתשלום. נבקשכם להסדיר את החוב בהקדם.</p>
                            <p>אם ברשותכם אסמכתא שהחשבוניות שולמו, פנו אלינו בכתב.</p>
                        </div>

                        <div class="signature-area">
                            <div class="signature-box">
                                <div style="font-weight: bold; text-align: right; padding-right: 40px;">בכבוד רב,</div>
                                <div style="text-align: center; margin-right: auto; width: 220px; margin-top: 40px; font-size: 14px; line-height: 1.6;">
                                    _______________________<br>
                                    <b style="display: inline-block; margin-top: 8px;">מחלקת שירות לקוחות וגבייה</b><br>
                                    אגף טכנולוגיות דיגיטליות ומידע<br>
                                    <a href="mailto:customer@mot.gov.il" style="color: #0B3C5D; text-decoration: none;">customer@mot.gov.il</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${autoPrintScript}
                </body></html>`);
            win.document.close();
            toggleExportModal(false);
        }

        function processExcel(e) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const wb = XLSX.read(evt.target.result, { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                
                db = rows.filter(r => String(r['לקוח'] || '').length === 8).map(r => {
                    const code = String(r['לקוח']);
                    const dueDate = parseExcelDate(r['מועד פרעון נטו'] || r['תאריך תשלום']);
                    const regDate = parseExcelDate(r['תאריך רישום'] || r['תאריך מסמך'] || r['תאריך תנועה'] || r['תאריך הזנה'] || r['תאריך ערך']);
                    const desc = r['טקסט'] || '';
                    const counterAccount = String(r['שם חשבון נגדי'] || '').trim();
                    return {
                        code, name: String(r['שם חשבון'] || 'לקוח').trim(),
                        doc: r['מספר מסמך'] || '-',
                        dueDate,
                        regDate,
                        amount: parseFloat(String(r['סכום במטבע מסמך'] || 0).replace(/,/g, '')),
                        desc,
                        counterAccount,
                        isFee: FEE_KEYWORDS.some(kw => counterAccount.includes(kw)),
                        isOverdue: dueDate < TODAY,
                        sector: code.startsWith('1') ? "ממשלתי" : code.startsWith('2') ? "שלטון מקומי" : "פרטי/רשויות"
                    };
                });

                // הגבלת תאריך עדכניות הנתונים לתאריך הנוכחי הריאלי של היום (שמירה מתקרת התאריך של היום)
                if (db.length > 0 && revenueDb.length === 0) {
                    const regDates = db.map(r => r.regDate).filter(d => d instanceof Date && !isNaN(d.getTime()));
                    if (regDates.length > 0) {
                        const realToday = new Date();
                        const validDates = regDates.filter(d => d <= realToday);
                        const targetDate = validDates.length > 0 ? new Date(Math.max(...validDates)) : realToday;
                        const formattedDate = targetDate.toLocaleDateString('he-IL');
                        const currencyEl = document.getElementById('data-currency-date');
                        currencyEl.innerText = `תאריך עדכניות הנתונים: ${formattedDate}`;
                        currencyEl.classList.remove('hidden');
                    }
                }

                currentLevel = 0; refresh();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        }

        // פונקציית עיבוד קובץ הכנסות שנת 2026
        function processRevenueExcel(e) {
            const reader = new FileReader();
            reader.onload = (evt) => {
                const wb = XLSX.read(evt.target.result, { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                
                revenueDb = rows.filter(r => String(r['לקוח'] || '').length === 8).map(r => {
                    const code = String(r['לקוח']);
                    const dueDate = parseExcelDate(r['מועד פרעון נטו'] || r['תאריך תשלום'] || r['מועד פירעון']);
                    const regDate = parseExcelDate(r['תאריך רישום'] || r['תאריך מסמך'] || r['תאריך ערך']);
                    const matchDateVal = r['תאריך התאמה'] || r['תאריך התאמה נטו'] || r['תאריך תשלום'];
                    const matchDate = matchDateVal ? parseExcelDate(matchDateVal) : null;
                    const desc = r['טקסט'] || '';
                    const counterAccount = String(r['שם חשבון נגדי'] || '').trim();
                    return {
                        code, name: String(r['שם חשבון'] || r['שם לקוח'] || 'לקוח').trim(),
                        doc: r['מספר מסמך'] || '-',
                        dueDate,
                        regDate,
                        matchDate,
                        amount: parseFloat(String(r['סכום במטבע מסמך'] || r['סכום'] || 0).replace(/,/g, '')),
                        desc,
                        counterAccount,
                        isFee: FEE_KEYWORDS.some(kw => counterAccount.includes(kw)),
                        sector: code.startsWith('1') ? "ממשלתי" : code.startsWith('2') ? "שלטון מקומי" : "פרטי/רשויות"
                    };
                });

                // הגבלת תאריך עדכניות נתוני התאמה לתאריך הנוכחי הריאלי של היום (שמירה מתקרת התאריך של היום)
                if (revenueDb.length > 0) {
                    const matchDates = revenueDb.map(r => r.matchDate).filter(d => d instanceof Date && !isNaN(d.getTime()));
                    if (matchDates.length > 0) {
                        const realToday = new Date();
                        const validDates = matchDates.filter(d => d <= realToday);
                        const targetDate = validDates.length > 0 ? new Date(Math.max(...validDates)) : realToday;
                        const formattedDate = targetDate.toLocaleDateString('he-IL');
                        const currencyEl = document.getElementById('data-currency-date');
                        currencyEl.innerText = `תאריך עדכניות הנתונים (התאמה): ${formattedDate}`;
                        currencyEl.classList.remove('hidden');
                    }
                }

                currentLevel = 0; refresh();
            };
            reader.readAsArrayBuffer(e.target.files[0]);
        }

        function parseExcelDate(val) {
            if (!val) return new Date();
            if (!isNaN(val)) return new Date(Math.round((val - 25569) * 86400 * 1000));
            const p = String(val).split('/');
            return p.length === 3 ? new Date(p[2], p[1]-1, p[0]) : new Date(val);
        }

        function formatCurrency(v) { return "₪" + Math.round(v).toLocaleString('he-IL'); }
    </script>
</body>
