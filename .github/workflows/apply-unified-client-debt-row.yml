name: Apply unified client debt row

on:
  push:
    branches:
      - agent/unify-client-debt-row
    paths:
      - .codex/unify-client-debt-row.patch
      - .github/workflows/apply-unified-client-debt-row.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified patch
        shell: bash
        run: |
          git apply --check .codex/unify-client-debt-row.patch
          git apply .codex/unify-client-debt-row.patch
          rm .codex/unify-client-debt-row.patch
          rm .github/workflows/apply-unified-client-debt-row.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify client past debt metrics into one row"
          git push
