name: Apply client card print polish
on:
  push:
    branches:
      - agent/client-profile-insights-collections
permissions:
  contents: write
jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-profile-insights-collections
          fetch-depth: 0
      - name: Apply staged update
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE=".codex-upload/client-card-print-fix.patch.gz.b64"
          if [[ ! -f "$PATCH_FILE" ]]; then exit 0; fi
          base64 --decode "$PATCH_FILE" | gzip --decompress > /tmp/client-card-print-fix.patch
          git apply --check --ignore-space-change --ignore-whitespace /tmp/client-card-print-fix.patch
          git apply --ignore-space-change --ignore-whitespace /tmp/client-card-print-fix.patch
          rm -rf .codex-upload
          rm -f .github/workflows/apply-client-card-print-fix.yml
          git config user.name "codex-dashboard-update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish client card print layout"
          git push origin HEAD:agent/client-profile-insights-collections
