name: Apply unmatched transfers refinement
on:
  push:
    branches:
      - agent/refine-unmatched-transfers
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refine-unmatched-transfers
      - name: Apply prepared patch
        run: |
          git apply --whitespace=nowarn .codex-refine-unmatched.patch
          rm .codex-refine-unmatched.patch
          rm .github/workflows/apply-refine-unmatched.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "שיפור תצוגת העברות שטרם הותאמו"
          git push origin HEAD:agent/refine-unmatched-transfers
