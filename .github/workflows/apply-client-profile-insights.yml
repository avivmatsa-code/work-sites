name: Apply Codex staged dashboard update

on:
  push:
    branches:
      - agent/client-profile-insights-collections

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/client-profile-insights-collections
          fetch-depth: 0
      - name: Apply staged update
        shell: bash
        run: |
          set -euo pipefail
          PATCH_FILE=".codex-upload/client-profile-insights.patch.gz.b64"
          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "No staged patch remains."
            exit 0
          fi
          base64 --decode "$PATCH_FILE" | gzip --decompress > /tmp/client-profile-insights.patch
          git apply --check /tmp/client-profile-insights.patch
          git apply /tmp/client-profile-insights.patch
          rm -rf .codex-upload
          rm -f .github/workflows/apply-client-profile-insights.yml
          git config user.name "codex-dashboard-update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add reusable collection metrics and client insights"
          git push origin HEAD:agent/client-profile-insights-collections
